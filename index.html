<html lang="pt-BR"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro - Módulo 10</title>

</head>
<body>

  <header>
    <h1>Adquira seu veículo agora mesmo!</h1>
  </header>

  <div id="carousel-imagens">
    <img src="file:///C:/Users/User/Downloads/assets/slide1.png" alt="Carro da Porsche">
    <img src="file:///C:/Users/User/Downloads/assets/slide2.png" alt="Carro da BMW">
    <img src="file:///C:/Users/User/Downloads/assets/slide3.png" alt="Carro da Ford">
  </div>

  <div class="container">
    <h2>Insira seus dados para finalização da compra</h2>

    <form id="form">
      <div class="form-campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="John Doe">
      </div>
      <div class="form-campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="email@exemplo.com">
      </div>
      <div class="form-campo">
        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
      </div>
      <div class="form-campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
      </div>
      <div class="form-campo">
        <label for="endereco">Endereço completo</label>
        <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro, cidade, estado">
      </div>
      <div class="form-campo">
        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" placeholder="00000-000">
      </div>
      <button type="submit">Enviar</button>
    </form>
  </div>

  <!-- 1. jQuery PRIMEIRO -->
  <script src="./index_files/jquery-1.11.0.min.js.download"></script>
